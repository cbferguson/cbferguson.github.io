<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlwaysBank</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
    video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video
    id="v"
    src="https://www.22ndstatebank.com/wp-content/uploads/2026/07/AlwaysBank_Heartbeat_60_WEB.mp4"
    autoplay
    playsinline
    loop
    controls
  ></video>

  <script>
    const v = document.getElementById('v');

    // Request fullscreen and play immediately
    function goFullscreen() {
      const req = v.requestFullscreen || v.webkitRequestFullscreen || v.mozRequestFullScreen || v.msRequestFullscreen;
      if (req) req.call(v).catch(() => {
        const d = document.documentElement;
        const dreq = d.requestFullscreen || d.webkitRequestFullscreen;
        if (dreq) dreq.call(d).catch(() => {});
      });
    }

    // Play and fullscreen as soon as enough data is loaded
    v.addEventListener('canplay', () => {
      v.play().then(() => goFullscreen()).catch(() => {
        // If autoplay blocked, play on first user interaction
        document.addEventListener('click', () => {
          v.play().then(() => goFullscreen());
        }, { once: true });
      });
    });

    // Re-enter fullscreen if user exits
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) goFullscreen();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement) goFullscreen();
    });
  </script>
</body>
</html>
