<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Video Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <iframe
    id="player"
    src="https://next.frame.io/share/e231ce39-9603-4f2c-a0e3-6bef4d88aff7/view/d392cc64-7bdb-4a94-907c-9e58b887101f"
    allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
    allowfullscreen
    frameborder="0"
    scrolling="no"
  ></iframe>

  <script>
    // Request fullscreen on the iframe element immediately
    function goFullscreen() {
      const el = document.getElementById('player');
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) req.call(el).catch(() => {
        // Fall back to fullscreening the whole document
        const doc = document.documentElement;
        const dreq = doc.requestFullscreen || doc.webkitRequestFullscreen;
        if (dreq) dreq.call(doc).catch(() => {});
      });
    }

    // Try on load
    window.addEventListener('load', () => {
      goFullscreen();
    });

    // Re-request if user exits fullscreen
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) goFullscreen();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement) goFullscreen();
    });
  </script>

</body>
</html>
